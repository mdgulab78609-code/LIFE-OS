<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="100%" stop-color="#03060f"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#d946ef"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- App Rounded Icon Surface -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="4"/>

  <!-- Glowing Emblem -->
  <g transform="translate(64, 64) scale(0.75)" filter="url(#glow)">
    <!-- Outer Shield / Circle -->
    <circle cx="256" cy="256" r="200" fill="none" stroke="url(#primaryGrad)" stroke-width="24" stroke-linecap="round" stroke-dasharray="850 150"/>
    
    <!-- Central Modern 'L' and Flame/Target Concept -->
    <path d="M 180 140 L 180 340 L 330 340" fill="none" stroke="url(#primaryGrad)" stroke-width="38" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Dynamic Progress Dot / Orbit -->
    <circle cx="340" cy="180" r="28" fill="#06b6d4"/>
    <circle cx="340" cy="180" r="14" fill="#ffffff"/>
  </g>
</svg>
